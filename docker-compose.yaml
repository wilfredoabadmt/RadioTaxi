version: '3.9'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DATABASE_USER:-radiotaxi}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-radiotaxi}
      POSTGRES_DB: ${DATABASE_NAME:-radiotaxi}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radiotaxi"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${DATABASE_USER:-radiotaxi}:${DATABASE_PASSWORD:-radiotaxi}@postgres:5432/${DATABASE_NAME:-radiotaxi}
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-secret-change-me}
    labels:
      - "coolify.managed=true"

  realtime:
    build:
      context: .
      dockerfile: services/realtime/Dockerfile
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3002
      DATABASE_URL: postgres://${DATABASE_USER:-radiotaxi}:${DATABASE_PASSWORD:-radiotaxi}@postgres:5432/${DATABASE_NAME:-radiotaxi}
      # MISMO secreto que la API para validar los JWT del socket.
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-secret-change-me}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}

  dashboard:
    build:
      context: .
      dockerfile: apps/dispatch-dashboard/Dockerfile
    ports:
      - "3001:3000"
    depends_on:
      - api
      - realtime
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000/api}
      NEXT_PUBLIC_REALTIME_URL: ${NEXT_PUBLIC_REALTIME_URL:-http://localhost:3002}
    labels:
      - "coolify.managed=true"

  asterisk:
    build:
      context: ./infrastructure/asterisk
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
      - "8088:8088"
      - "5038:5038"
      - "10000-10100:10000-10100/udp"
    volumes:
      - recordings-data:/var/spool/asterisk/monitor
    labels:
      - "coolify.managed=true"

  telephony:
    build:
      context: .
      dockerfile: services/telephony/Dockerfile
    ports:
      - "3003:3003"
    depends_on:
      - api
      - realtime
      - asterisk
    environment:
      PORT: 3003
      API_URL: http://api:3000/api
      REALTIME_URL: http://realtime:3002
      ASTERISK_ARI_URL: http://asterisk:8088/ari
      ASTERISK_ARI_USER: radiotaxi_ari
      ASTERISK_ARI_PASS: RadioTaxiAriPass2026!
      ASTERISK_AMI_HOST: asterisk
      ASTERISK_AMI_PORT: 5038
      ASTERISK_AMI_USER: radiotaxi_ami
      ASTERISK_AMI_PASS: RadioTaxiAmiSecret2026!
    labels:
      - "coolify.managed=true"

volumes:
  postgres-data: {}
  recordings-data: {}

