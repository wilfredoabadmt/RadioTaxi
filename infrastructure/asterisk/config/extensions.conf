; ============================================================================
; RadioTaxi VoIP - Dialplan (extensions.conf)
; ============================================================================

[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]
RECORDINGS_DIR=/var/spool/asterisk/monitor

; --- Contexto de Entrada desde Troncal Telefónica (PSTN / DID) ---
[from-pstn]
exten => _X.,1,NoOp(=== LLAMADA ENTRANTE RADIOTAXI DESDE ${CALLERID(num)} HACIA ${EXTEN} ===)
 same => n,Set(CALL_UUID=${UNIQUEID})
 same => n,Set(CHANNEL(hangup_handler_push)=call-hangup-handler,s,1)
 ; Iniciar grabación de audio estéreo
 same => n,MixMonitor(${RECORDINGS_DIR}/${CALL_UUID}.wav,b)
 ; Enviar evento a la aplicación ARI para control e identificación de cliente
 same => n,Stasis(radiotaxi-dispatch)
 same => n,Hangup()

exten => s,1,NoOp(=== LLAMADA ENTRANTE RADIOTAXI SIN EXTENSION ===)
 same => n,Set(CALL_UUID=${UNIQUEID})
 same => n,Set(CHANNEL(hangup_handler_push)=call-hangup-handler,s,1)
 same => n,MixMonitor(${RECORDINGS_DIR}/${CALL_UUID}.wav,b)
 same => n,Stasis(radiotaxi-dispatch)
 same => n,Hangup()

; --- Subrutina de Finalización de Llamada ---
[call-hangup-handler]
exten => s,1,NoOp(=== LLAMADA FINALIZADA UUID: ${CALL_UUID} DURACION: ${CDR(billsec)}s ===)
 same => n,Return()

; --- Contexto de Operadores / Despachadores ---
[from-operators]
exten => _1XX,1,NoOp(=== LLAMADA INTERNA ENTRE DESPACHADORES: ${EXTEN} ===)
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()

exten => _9X.,1,NoOp(=== LLAMADA SALIENTE AL CLIENTE: ${EXTEN:1} ===)
 same => n,MixMonitor(${RECORDINGS_DIR}/out-${UNIQUEID}.wav,b)
 same => n,Dial(PJSIP/${EXTEN:1}@trunk-incoming,60)
 same => n,Hangup()
