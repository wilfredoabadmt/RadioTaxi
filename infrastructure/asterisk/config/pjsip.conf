; ============================================================================
; RadioTaxi VoIP - Asterisk PJSIP Configuration
; ============================================================================

[global]
type=global
user_agent=RadioTaxi-PBX/1.0

; --- Transportes ---
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0:8088

; --- Plantilla de Operadores / Despacho ---
[operator-endpoint](!)
type=endpoint
context=from-operators
disallow=all
allow=ulaw
allow=alaw
allow=opus
direct_media=no
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes

[operator-auth](!)
type=auth
auth_type=userpass

[operator-aor](!)
type=aor
max_contacts=3
remove_existing=yes

; --- Operador 101 ---
[101](operator-endpoint)
auth=101-auth
aors=101

[101-auth](operator-auth)
username=101
password=RadioTaxiOperator101#

[101](operator-aor)

; --- Operador 102 ---
[102](operator-endpoint)
auth=102-auth
aors=102

[102-auth](operator-auth)
username=102
password=RadioTaxiOperator102#

[102](operator-aor)

; --- Troncal SIP Proveedor / Línea Telefónica Pública ---
[trunk-incoming]
type=endpoint
context=from-pstn
disallow=all
allow=ulaw
allow=alaw
direct_media=no
