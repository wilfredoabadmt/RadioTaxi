name: CI / Quality Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Lint, Typecheck & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate --schema=services/api/prisma/schema.prisma

      - name: Typecheck - services/api
        run: npx tsc --noEmit
        working-directory: services/api

      - name: Typecheck - services/realtime
        run: npx tsc --noEmit
        working-directory: services/realtime

      - name: Typecheck - services/telephony
        run: npx tsc --noEmit
        working-directory: services/telephony

      - name: Typecheck - apps/dispatch-dashboard
        run: npx tsc --noEmit
        working-directory: apps/dispatch-dashboard

      - name: Run Jest Unit Tests - services/api
        run: npm test -w services/api

      - name: Run Jest Unit Tests - services/realtime
        run: npm test -w services/realtime

  docker-build:
    name: Verify Docker Container Builds
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/api/Dockerfile
          push: false

      - name: Build Realtime Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/realtime/Dockerfile
          push: false

      - name: Build Asterisk Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./infrastructure/asterisk
          file: ./infrastructure/asterisk/Dockerfile
          push: false
